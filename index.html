<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCT-Lernpfad</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-title">
      <strong id="app-title">MCT-Lernpfad</strong>
    </div>

    <nav class="ue-navigation" aria-label="Unterrichtseinheit">
      <button id="previous-ue" class="ue-step" type="button" aria-label="Vorherige Unterrichtseinheit">‹</button>
      <span id="ue-label" aria-live="polite">Basis</span>
      <button id="next-ue" class="ue-step" type="button" aria-label="Nächste Unterrichtseinheit">›</button>
    </nav>

    <div class="toolbar-actions">
      <div class="zoom-controls" role="group" aria-label="Dokument-Zoom">
        <button id="zoom-out" type="button" title="Verkleinern (Strg+Minus)" aria-label="Verkleinern">−</button>
        <button id="zoom-reset" type="button" title="Zoom zurücksetzen (Strg+0)" aria-label="Zoom zurücksetzen">100 %</button>
        <button id="zoom-in" type="button" title="Vergrößern (Strg+Plus)" aria-label="Vergrößern">+</button>
      </div>
      <span id="status" aria-live="polite"></span>
      <button id="reload" type="button" title="Dokument neu laden">Neu laden</button>
    </div>
  </header>

  <main id="content" class="markdown-body"></main>

  <script src="vendor/markdown-it.min.js"></script>
  <script src="hosts/linux.js"></script>
  <script src="hosts/browser.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
