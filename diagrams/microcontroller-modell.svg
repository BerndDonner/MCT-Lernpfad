<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="720" height="220" viewBox="0 0 720 220">
  <style>@import url("diagram-theme.css");</style>

  <title>Vereinfachtes Mikrocontroller-Modell</title>
  <desc>CPU und Speicher sind durch eine bidirektionale Verbindung gekoppelt.</desc>

  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="marker-standard"/>
    </marker>
  </defs>

  <g id="cpu">
    <rect x="60" y="60" width="180" height="100" class="box"/>
    <text x="150" y="119" text-anchor="middle" class="title">CPU</text>
  </g>

  <g id="memory">
    <rect x="480" y="60" width="180" height="100" class="box"/>
    <text x="570" y="105" text-anchor="middle" class="section-title">Speicher</text>
    <text x="570" y="136" text-anchor="middle" class="label">(2048 Bytes)</text>
  </g>

  <line x1="258" y1="110" x2="462" y2="110"
        class="arrow-standard"
        marker-start="url(#arrow-end)" marker-end="url(#arrow-end)"/>
</svg>
