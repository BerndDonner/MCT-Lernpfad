<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="720" height="220" viewBox="0 0 720 220">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="Basis UE 1" id="layer-base">
    <g id="cpu">
      <rect id="cpu-box" x="60" y="60" width="180" height="100" rx="10"
            fill="#fff" stroke="#222" stroke-width="3"/>
      <text id="cpu-label" x="150" y="119" text-anchor="middle"
            font-family="sans-serif" font-size="28">CPU</text>
    </g>

    <g id="memory">
      <rect id="memory-box" x="480" y="60" width="180" height="100" rx="10"
            fill="#fff" stroke="#222" stroke-width="3"/>
      <text id="memory-label" x="570" y="105" text-anchor="middle"
            font-family="sans-serif" font-size="25">Speicher</text>
      <text id="memory-size" x="570" y="136" text-anchor="middle"
            font-family="sans-serif" font-size="20">(2048 Bytes)</text>
    </g>

    <line id="cpu-memory-link" x1="258" y1="110" x2="462" y2="110"
          stroke="#222" stroke-width="3"
          marker-start="url(#arrow-end)" marker-end="url(#arrow-end)"/>
  </g>
</svg>
