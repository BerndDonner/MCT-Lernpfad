<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <style>@import url("diagram-theme.css");
    .op { font-family: "MCT JetBrains Mono", "JetBrains Mono", monospace; font-size: 30px; font-weight: 700; }
    .bits { font-family: "MCT JetBrains Mono", "JetBrains Mono", monospace; font-size: 30px; font-weight: 600; letter-spacing: 2px; }
    .caption { font-size: 17px; }
    .mask-and { fill: #dbeafe; }
    .mask-or { fill: #fee2e2; }
    .mask-xor { fill: #fef3c7; }
    .result { fill: #eaf7ea; stroke: #79b879; stroke-width: 1.5px; rx: 8px; ry: 8px; }
    .rule { stroke: #8c959f; stroke-width: 2px; }
  </style>
  <title>Bitoperationen mit Masken</title>
  <desc>Beispiele für bitweises UND, ODER und XOR. UND kann Bits ausschalten, ODER einschalten und XOR umschalten.</desc>

  <text x="40" y="48" class="title">Bitoperationen mit Masken</text>

  <!-- AND -->
  <g transform="translate(35,80)">
    <rect x="0" y="0" width="1130" height="220" class="panel"/>
    <text x="25" y="42" class="section-title">UND: <tspan class="mono">&amp;</tspan></text>
    <text x="25" y="76" class="label">Mit <tspan class="mono">&amp;</tspan> können Bits gezielt ausgeschaltet werden.</text>

    <text x="235" y="118" text-anchor="end" class="label-strong">Wert</text>
    <text x="270" y="118" class="bits">1011 0110</text>

    <text x="235" y="158" text-anchor="end" class="label-strong">Maske</text>
    <rect x="263" y="128" width="267" height="39" class="mask-and" rx="7" ry="7"/>
    <text x="270" y="158" class="bits">1111 0000</text>
    <text x="555" y="158" class="op">&amp;</text>

    <line x1="265" y1="173" x2="532" y2="173" class="rule"/>
    <rect x="263" y="177" width="267" height="7" fill="transparent"/>
    <text x="650" y="138" class="caption">0 in der Maske → Ergebnisbit wird 0</text>
    <text x="650" y="165" class="caption">1 in der Maske → ursprüngliches Bit bleibt erhalten</text>

    <rect x="263" y="174" width="267" height="0" class="result"/>
    <text x="270" y="208" class="bits">1011 0000</text>
  </g>

  <!-- OR -->
  <g transform="translate(35,320)">
    <rect x="0" y="0" width="1130" height="220" class="panel"/>
    <text x="25" y="42" class="section-title">ODER: <tspan class="mono">|</tspan></text>
    <text x="25" y="76" class="label">Mit <tspan class="mono">|</tspan> können Bits gezielt eingeschaltet werden.</text>

    <text x="235" y="118" text-anchor="end" class="label-strong">Wert</text>
    <text x="270" y="118" class="bits">1011 0010</text>

    <text x="235" y="158" text-anchor="end" class="label-strong">Maske</text>
    <rect x="263" y="128" width="267" height="39" class="mask-or" rx="7" ry="7"/>
    <text x="270" y="158" class="bits">0000 1101</text>
    <text x="555" y="158" class="op">|</text>

    <line x1="265" y1="173" x2="532" y2="173" class="rule"/>
    <text x="650" y="138" class="caption">1 in der Maske → Ergebnisbit wird 1</text>
    <text x="650" y="165" class="caption">0 in der Maske → ursprüngliches Bit bleibt erhalten</text>

    <text x="270" y="208" class="bits">1011 1111</text>
  </g>

  <!-- XOR -->
  <g transform="translate(35,560)">
    <rect x="0" y="0" width="1130" height="220" class="panel"/>
    <text x="25" y="42" class="section-title">XOR: <tspan class="mono">^</tspan></text>
    <text x="25" y="76" class="label">Mit <tspan class="mono">^</tspan> können Bits gezielt umgeschaltet (getoggelt) werden.</text>

    <text x="235" y="118" text-anchor="end" class="label-strong">Wert</text>
    <text x="270" y="118" class="bits">1011 0010</text>

    <text x="235" y="158" text-anchor="end" class="label-strong">Maske</text>
    <rect x="263" y="128" width="267" height="39" class="mask-xor" rx="7" ry="7"/>
    <text x="270" y="158" class="bits">1111 0000</text>
    <text x="555" y="158" class="op">^</text>

    <line x1="265" y1="173" x2="532" y2="173" class="rule"/>
    <text x="650" y="138" class="caption">1 in der Maske → 0 wird 1 und 1 wird 0</text>
    <text x="650" y="165" class="caption">0 in der Maske → ursprüngliches Bit bleibt erhalten</text>

    <text x="270" y="208" class="bits">0100 0010</text>
  </g>
</svg>
