<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="390" viewBox="0 0 900 390">
  <style>@import url("diagram-theme.css");</style>

  <title>Ablauf von setup() und loop()</title>
  <desc>Start oder Reset führt einmal durch setup() und danach wiederholt durch loop(). Reset und Spannungsunterbrechung sind als getrennte Pfade dargestellt.</desc>

  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="marker-standard"/>
    </marker>
    <marker id="arrow-end-primary" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="marker-primary"/>
    </marker>
  </defs>

  <g id="start">
    <rect x="40" y="135" width="150" height="70" rx="35" ry="35" class="box"/>
    <text x="115" y="177" text-anchor="middle" class="label">Start / Reset</text>
  </g>

  <line x1="190" y1="170" x2="275" y2="170"
        class="arrow-primary" marker-end="url(#arrow-end-primary)"/>

  <g id="setup">
    <rect x="285" y="125" width="180" height="90" class="box"/>
    <text x="375" y="165" text-anchor="middle" class="code-strong">setup()</text>
    <text x="375" y="194" text-anchor="middle" class="label">einmal</text>
  </g>

  <line x1="465" y1="170" x2="550" y2="170"
        class="arrow-primary" marker-end="url(#arrow-end-primary)"/>

  <g id="loop">
    <rect x="560" y="95" width="180" height="90" class="box"/>
    <text x="650" y="135" text-anchor="middle" class="code-strong">loop()</text>
    <text x="650" y="164" text-anchor="middle" class="label">immer wieder</text>

    <!-- Eigene Geometrie: rechts aus loop(), oberhalb zurück, links wieder hinein. -->
    <path d="M 740 140
             C 835 140, 825 56, 641 56
             C 400 56, 446 136, 551 136"
          class="arrow-primary" marker-end="url(#arrow-end-primary)"/>
  </g>

  <g id="reset-path">
    <path d="M 610 195 C 580 305, 375 325, 120 220"
          class="arrow-muted" stroke-dasharray="7 6"
          marker-end="url(#arrow-end)"/>
    <text x="375" y="315" text-anchor="middle" class="small">Reset</text>
  </g>

  <g id="power-off">
    <line x1="650" y1="185" x2="650" y2="330"
          class="arrow-muted" marker-end="url(#arrow-end)"/>
    <text x="675" y="270" class="small">Spannung getrennt</text>
    <text x="650" y="365" text-anchor="middle" class="label">Ende</text>
  </g>
</svg>
