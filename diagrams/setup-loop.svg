<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="900" height="390" viewBox="0 0 900 390">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="Basis UE 1" id="layer-base">
    <g id="start">
      <rect id="start-box" x="40" y="135" width="150" height="70" rx="35"
            fill="#fff" stroke="#222" stroke-width="2.5"/>
      <text id="start-label" x="115" y="177" text-anchor="middle"
            font-family="sans-serif" font-size="21">Start / Reset</text>
    </g>

    <line id="start-to-setup" x1="190" y1="170" x2="275" y2="170"
          stroke="#222" stroke-width="2.5" marker-end="url(#arrow-end)"/>

    <g id="setup">
      <rect id="setup-box" x="285" y="125" width="180" height="90" rx="9"
            fill="#fff" stroke="#222" stroke-width="2.5"/>
      <text id="setup-label" x="375" y="165" text-anchor="middle"
            font-family="monospace" font-size="25">setup()</text>
      <text id="setup-once" x="375" y="194" text-anchor="middle"
            font-family="sans-serif" font-size="18">einmal</text>
    </g>

    <line id="setup-to-loop" x1="465" y1="170" x2="550" y2="170"
          stroke="#222" stroke-width="2.5" marker-end="url(#arrow-end)"/>

    <g id="loop">
      <rect id="loop-box" x="560" y="125" width="180" height="90" rx="9"
            fill="#fff" stroke="#222" stroke-width="2.5"/>
      <text id="loop-label" x="650" y="165" text-anchor="middle"
            font-family="monospace" font-size="25">loop()</text>
      <text id="loop-repeat-label" x="650" y="194" text-anchor="middle"
            font-family="sans-serif" font-size="18">immer wieder</text>

      <path id="loop-repeat-arrow"
            d="M 700 225 C 785 245, 785 95, 700 115"
            fill="none" stroke="#222" stroke-width="2.5"
            marker-end="url(#arrow-end)"/>
    </g>

    <g id="reset-path">
      <path id="reset-arrow"
            d="M 610 225 C 580 315, 375 325, 120 220"
            fill="none" stroke="#222" stroke-width="2.2"
            stroke-dasharray="7 6" marker-end="url(#arrow-end)"/>
      <text id="reset-label" x="375" y="315" text-anchor="middle"
            font-family="sans-serif" font-size="17">Reset</text>
    </g>

    <g id="power-off">
      <line id="power-off-arrow" x1="650" y1="215" x2="650" y2="330"
            stroke="#222" stroke-width="2.2" marker-end="url(#arrow-end)"/>
      <text id="power-off-label" x="675" y="285"
            font-family="sans-serif" font-size="17">Spannung getrennt</text>
      <text id="end-label" x="650" y="365" text-anchor="middle"
            font-family="sans-serif" font-size="19">Ende</text>
    </g>
  </g>
</svg>
