<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="900"
   height="390"
   viewBox="0 0 900 390"
   version="1.1"
   id="svg2"
   sodipodi:docname="setup-loop.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview2"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.7666667"
     inkscape:cx="450"
     inkscape:cy="195"
     inkscape:window-width="2048"
     inkscape:window-height="1124"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="layer-base" />
  <defs
     id="defs2">
    <marker
       id="arrow-end"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#222"
         id="path1" />
    </marker>
    <marker
       id="arrow-end-blue"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="8"
       markerHeight="8"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#1f6feb"
         id="path2" />
    </marker>
  </defs>
  <g
     inkscape:groupmode="layer"
     inkscape:label="Basis UE 1"
     id="layer-base">
    <g
       id="start">
      <rect
         id="start-box"
         x="40"
         y="135"
         width="150"
         height="70"
         rx="35"
         fill="#fff"
         stroke="#222"
         stroke-width="2.5" />
      <text
         id="start-label"
         x="115"
         y="177"
         text-anchor="middle"
         font-family="sans-serif"
         font-size="21">Start / Reset</text>
    </g>
    <line
       id="start-to-setup"
       x1="190"
       y1="170"
       x2="275"
       y2="170"
       stroke="#1f6feb"
       stroke-width="4"
       marker-end="url(#arrow-end-blue)" />
    <g
       id="setup">
      <rect
         id="setup-box"
         x="285"
         y="125"
         width="180"
         height="90"
         rx="9"
         fill="#fff"
         stroke="#222"
         stroke-width="2.5" />
      <text
         id="setup-label"
         x="375"
         y="165"
         text-anchor="middle"
         font-family="monospace"
         font-size="25">setup()</text>
      <text
         id="setup-once"
         x="375"
         y="194"
         text-anchor="middle"
         font-family="sans-serif"
         font-size="18">einmal</text>
    </g>
    <line
       id="setup-to-loop"
       x1="465"
       y1="170"
       x2="550"
       y2="170"
       stroke="#1f6feb"
       stroke-width="4"
       marker-end="url(#arrow-end-blue)" />
    <g
       id="loop">
      <!-- loop-Box etwas angehoben -->
      <rect
         id="loop-box"
         x="560"
         y="95"
         width="180"
         height="90"
         rx="9"
         fill="#fff"
         stroke="#222"
         stroke-width="2.5" />
      <text
         id="loop-label"
         x="650"
         y="135"
         text-anchor="middle"
         font-family="monospace"
         font-size="25">loop()</text>
      <text
         id="loop-repeat-label"
         x="650"
         y="164"
         text-anchor="middle"
         font-family="sans-serif"
         font-size="18">immer wieder</text>
      <!-- loop->loop: rechts mittig raus, oberhalb zurück, links wieder rein -->
      <path
         id="loop-repeat-arrow"
         d="m 740,140 c 95,0 85.94288,-83.526971 -99.0566,-83.962264 -240.56604,-0.566038 -195.28302,79.433964 -90,80.000004"
         fill="none"
         stroke="#1f6feb"
         stroke-width="4"
         marker-end="url(#arrow-end-blue)"
         sodipodi:nodetypes="csc" />
    </g>
    <g
       id="reset-path">
      <path
         id="reset-arrow"
         d="M 610 195 C 580 305, 375 325, 120 220"
         fill="none"
         stroke="#222"
         stroke-width="2.2"
         stroke-dasharray="7 6"
         marker-end="url(#arrow-end)" />
      <text
         id="reset-label"
         x="375"
         y="315"
         text-anchor="middle"
         font-family="sans-serif"
         font-size="17">Reset</text>
    </g>
    <g
       id="power-off">
      <line
         id="power-off-arrow"
         x1="650"
         y1="185"
         x2="650"
         y2="330"
         stroke="#222"
         stroke-width="2.2"
         marker-end="url(#arrow-end)" />
      <text
         id="power-off-label"
         x="675"
         y="270"
         font-family="sans-serif"
         font-size="17">Spannung getrennt</text>
      <text
         id="end-label"
         x="650"
         y="365"
         text-anchor="middle"
         font-family="sans-serif"
         font-size="19">Ende</text>
    </g>
  </g>
</svg>
