<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360">
  <style>@import url("diagram-theme.css");</style>

  <title>Externe Darstellung und internes Bitmuster</title>
  <desc>Verschiedene Schreibweisen im Code und verschiedene Ausgaben beziehen sich auf dasselbe Bitmuster in einem Speicherbyte.</desc>

  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="marker-standard"/>
    </marker>
  </defs>

  <text x="150" y="45" text-anchor="middle" class="section-title">EINGABE</text>
  <text x="600" y="45" text-anchor="middle" class="section-title">MIKROCONTROLLER</text>
  <text x="1040" y="45" text-anchor="middle" class="section-title">AUSGABE</text>

  <text x="150" y="82" text-anchor="middle" class="label-strong">unser Code</text>
  <text x="600" y="82" text-anchor="middle" class="label-strong">Bitmuster in den Speicherbytes</text>
  <text x="1040" y="82" text-anchor="middle" class="label-strong">Darstellung</text>

  <line x1="245" y1="75" x2="425" y2="75"
        class="arrow-standard" marker-end="url(#arrow-end)"/>
  <line x1="775" y1="75" x2="945" y2="75"
        class="arrow-standard" marker-end="url(#arrow-end)"/>

  <g id="code-forms" class="code">
    <text x="95" y="145">0b01000001</text>
    <text x="95" y="195">65</text>
    <text x="95" y="245">0x41</text>
    <text x="95" y="295">'A'</text>
  </g>

  <g id="memory-byte">
    <rect x="508" y="172" width="184" height="60" class="box"/>
    <text x="600" y="211" text-anchor="middle" class="code-strong">01000001</text>
    <text x="600" y="259" text-anchor="middle" class="small mono">1 Byte</text>
  </g>

  <g id="output-forms" class="code">
    <text x="985" y="145">01000001</text>
    <text x="985" y="195">65</text>
    <text x="985" y="245">41</text>
    <text x="985" y="295">A</text>
  </g>
</svg>
